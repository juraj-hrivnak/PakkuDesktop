name: CI
run-name: "CI #${{ github.run_number }}"

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: windows-latest
            arch: amd64
          - os: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Nucleus
        uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v2.5.18
        with:
          java-version: '25'
          packaging-tools: 'true'
          snap: 'false'
          setup-gradle: 'true'
          setup-node: 'false'

      - name: Build
        shell: bash
        run: ./gradlew build --stacktrace --no-parallel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ matrix.os }}-${{ matrix.arch }}
          path: '**/build/reports'
          retention-days: 7
